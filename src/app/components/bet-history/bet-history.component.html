@if (loading()) {
  <div class="loading-container">
    <mat-spinner></mat-spinner>
  </div>
}

<div class="bet-history-container">
  <header class="header">
    <h1>Bet History</h1>
    <button
      mat-raised-button
      color="warn"
      (click)="clearHistory()"
      [disabled]="allBets().length === 0"
    >
      <mat-icon>delete_sweep</mat-icon>
      Clear History
    </button>
  </header>

  <!-- Stats Cards -->
  <sb-bet-stats-cards [stats]="stats()" />

  <!-- Tabs for filtering -->
  <sb-bet-history-tabs
    [allBets]="allBets()"
    [pendingBets]="pendingBets()"
    [settledBets]="settledBets()"
    (deleteBet)="deleteBet($event)"
  />
</div>
