<mat-card class="betslip-card">
  <mat-card-header>
    <mat-card-title>
      <mat-icon>receipt</mat-icon>
      Betslip
      @if (betCount() > 0) {
        <span class="bet-count">{{ betCount() }}</span>
      }
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    @if (bets().length === 0) {
      <div class="empty-betslip">
        <mat-icon>shopping_cart</mat-icon>
        <p>Your betslip is empty</p>
        <p class="hint">Add events from the events list</p>
      </div>
    } @else {
      <sb-bet-list
        [bets]="bets()"
        (stakeUpdated)="onStakeUpdated($event)"
        (betRemoved)="onBetRemoved($event)"
      />

      <sb-betslip-summary
        [totalStake]="totalStake()"
        [totalOdds]="totalOdds()"
        [potentialWin]="potentialWin()"
        [isPlaceBetDisabled]="isPlaceBetDisabled()"
        (placeBet)="onPlaceBet()"
        (clearBetslip)="onClearBetslip()"
      />
    }
  </mat-card-content>
</mat-card>
