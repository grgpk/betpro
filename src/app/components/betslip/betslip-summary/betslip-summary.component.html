<dl class="summary-stats">
  <div class="summary-row">
    <dt>Total Stakes:</dt>
    <dd>
      <strong>${{ totalStake().toFixed(2) }}</strong>
    </dd>
  </div>

  <div class="summary-row">
    <dt>Combined Odds:</dt>
    <dd>
      <strong>{{ totalOdds().toFixed(2) }}</strong>
    </dd>
  </div>

  <mat-divider></mat-divider>

  <div class="summary-row total">
    <dt>Potential Win:</dt>
    <dd>
      <strong class="win-amount">${{ potentialWin().toFixed(2) }}</strong>
    </dd>
  </div>
</dl>

<div class="summary-actions">
  <button
    mat-raised-button
    color="primary"
    (click)="onPlaceBet()"
    [disabled]="isPlaceBetDisabled()"
  >
    <mat-icon>check_circle</mat-icon>
    Place Bet
  </button>

  <button mat-button (click)="onClearBetslip()">
    <mat-icon>delete_sweep</mat-icon>
    Clear All
  </button>
</div>
