@if (loading()) {
  <div class="loading-container">
    <mat-spinner></mat-spinner>
  </div>
}
@if (error()) {
  <mat-card class="error-card">
    <mat-icon color="warn">error</mat-icon>
    <p>{{ error() }}</p>
    <button mat-raised-button routerLink="/events">Back to Events</button>
  </mat-card>
}
@if (!loading() && !error() && event()) {
  <div class="header">
    <h1>{{ event()!.title }}</h1>
    <div class="actions">
      @if (!isEditMode) {
        <button mat-raised-button color="primary" (click)="toggleEditMode()">
          <mat-icon>edit</mat-icon>
          Edit
        </button>
        <button mat-raised-button color="warn" (click)="deleteEvent()">
          <mat-icon>delete</mat-icon>
          Delete
        </button>
      } @else {
        <button
          mat-raised-button
          color="primary"
          (click)="saveEvent()"
          [disabled]="!eventForm.valid"
        >
          <mat-icon>save</mat-icon>
          Save
        </button>
        <button mat-button (click)="toggleEditMode()">Cancel</button>
      }
      <button mat-raised-button class="back-button" routerLink="/events">
        <mat-icon>arrow_back</mat-icon>
        Back to Events
      </button>
    </div>
  </div>

  <mat-card class="event-details-card">
    @if (!isEditMode) {
      <sb-event-view [event]="event()!" (addToBetslip)="addToBetslip($event)" />
    } @else {
      <sb-event-edit
        [eventForm]="eventForm"
        [sports]="sports"
        [statuses]="statuses"
        [hasDraw]="hasDraw"
      />
    }
  </mat-card>
}
